name: eval

on:
  workflow_dispatch:
    inputs:
      case:
        description: "case name glob"
        type: string
        default: "*"
      changed_since:
        description: "git ref: run only the cases scripts/eval-select.mjs picks for changes since this ref (empty: use case)"
        type: string
        default: ""
      runs:
        description: "runs per case (1-10)"
        type: string
        default: "1"
      model:
        description: "main-session model"
        type: string
        default: "claude-opus-5-5"
      max_cost_usd:
        description: "cost cap in USD (above 0, at most 20)"
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate inputs
        env:
          RUNS: ${{ inputs.runs || '1' }}
          MAX_COST: ${{ inputs.max_cost_usd || '3' }}
          MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
          BASE: ${{ inputs.changed_since }}
        run: |
          case "$RUNS" in ''|*[!0-9]*|0*) echo "::error::runs must be a whole number of at least 1, got '$RUNS'"; exit 1;; esac
          [ "$RUNS" -le 10 ] 2>/dev/null || { echo "::error::runs must be at most 10, got '$RUNS'"; exit 1; }
          re='^[0-9]+(\.[0-9]+)?$'
          [[ $MAX_COST =~ $re ]] || { echo "::error::max_cost_usd must be a number such as 3 or 2.5, got '$MAX_COST'"; exit 1; }
          awk -v c="$MAX_COST" 'BEGIN{exit !(c>0)}' || { echo "::error::max_cost_usd must be above 0"; exit 1; }
          awk -v c="$MAX_COST" 'BEGIN{exit !(c<=20)}' || { echo "::error::max_cost_usd must be at most 20, got '$MAX_COST'"; exit 1; }
          re='^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$'
          [[ $MODEL =~ $re ]] || { echo "::error::model must be a model id such as claude-opus-5-5, got '$MODEL'"; exit 1; }
          re='^[A-Za-z0-9][A-Za-z0-9._/~^@-]{0,199}$'
          [ -z "$BASE" ] || [[ $BASE =~ $re ]] || { echo "::error::changed_since must be a git ref such as main or HEAD~3, got '$BASE'"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Select cases
        id: select
        env:
          BASE: ${{ inputs.changed_since }}
          CASE_IN: ${{ inputs.case || '*' }}
        run: |
          out="$GITHUB_OUTPUT"
          if [ -z "$BASE" ]; then
            echo "case=$CASE_IN" >> "$out"
            echo "skip=false" >> "$out"
            echo "partial=false" >> "$out"
            exit 0
          fi
          if ! plan=$(node scripts/eval-select.mjs --base "$BASE" --plan); then
            echo "::error::could not select eval cases for git ref $BASE"
            exit 1
          fi
          printf '%s\n' "$plan" >> "$out"
          if printf '%s\n' "$plan" | grep -qx 'skip=true'; then
            echo "::notice::no eval case is affected since $BASE; eval skipped"
          fi

      - name: Install sandbox backend
        if: steps.select.outputs.skip != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "::warning::could not relax the AppArmor user-namespace restriction; the Claude sandbox may fail"

      # Pinned Claude Code CLI (no Dependabot path for a global npm install). Update: change the version here and in evals/README.md "Claude Code version in CI" together, run this workflow once, and refresh evals/baseline.json if token counts moved.
      - name: Install Claude Code
        if: steps.select.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.317

      # The eval agent runs with Bash and can read ANTHROPIC_API_KEY from its environment: use a dedicated key with a low spend limit, and keep this workflow workflow_dispatch-only.
      - name: Check secret
        if: steps.select.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret"
            exit 1
          fi

      - name: Run eval
        id: eval
        if: steps.select.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASE: ${{ steps.select.outputs.case }}
          RUNS: ${{ inputs.runs || '1' }}
          MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
          MAX_COST: ${{ inputs.max_cost_usd || '3' }}
          PARTIAL: ${{ steps.select.outputs.partial }}
          SELECTED: ${{ steps.select.outputs.selected }}
        run: |
          if [ "$PARTIAL" = "true" ]; then
            PER=$(node -e 'const n=process.env.SELECTED.split(",").filter(Boolean).length;const m=Number(process.env.MAX_COST);const p=n>0?m/n:m;console.log((p<0.01?m:p).toFixed(2))')
            rc=0
            for c in $(printf '%s' "$SELECTED" | tr ',' ' '); do
              claude plugin eval . --case "$c" --runs "$RUNS" --ablation none --scaffold --trust-plugin --allow-tools Bash Edit Write --model "$MODEL" --judge-model claude-haiku-5-5 --max-cost-usd "$PER" --no-publish --json "evals/ci-result-$c.json" || rc=1
            done
            node -e 'const fs=require("fs");const p=process.env.SELECTED.split(",").filter(Boolean).map(c=>"evals/ci-result-"+c+".json").filter(f=>fs.existsSync(f)).map(f=>JSON.parse(fs.readFileSync(f,"utf8")));fs.writeFileSync("evals/ci-result.json",JSON.stringify({...p[0],cases:p.flatMap(x=>x.cases||[])}))'
            exit $rc
          else
            claude plugin eval . --case "$CASE" --runs "$RUNS" --ablation none --scaffold --trust-plugin --allow-tools Bash Edit Write --model "$MODEL" --judge-model claude-haiku-5-5 --max-cost-usd "$MAX_COST" --no-publish --json evals/ci-result.json
          fi

      - name: Require eval result
        if: always() && steps.eval.conclusion != 'skipped'
        run: |
          if [ ! -s evals/ci-result.json ]; then
            echo "::error::The eval run produced no evals/ci-result.json (the Run eval step failed or was cancelled). This is a failed run, not a missing baseline."
            exit 1
          fi

      - name: Check selected cases ran
        if: success() && steps.select.outputs.partial == 'true'
        env:
          SELECTED: ${{ steps.select.outputs.selected }}
        run: |
          node -e '
            const want = process.env.SELECTED.split(",").filter(Boolean).sort();
            const got = (require("./evals/ci-result.json").cases || []).map(c => c.name).sort();
            if (JSON.stringify(want) !== JSON.stringify(got)) {
              console.log("::error::the per-case eval runs did not cover exactly the selected cases (want " + want.join(",") + ", got " + got.join(",") + ")");
              process.exit(1);
            }
          '

      - name: Warn when baseline is missing
        if: success() && hashFiles('evals/baseline.json') == '' && steps.select.outputs.skip != 'true'
        run: |
          echo "::warning::evals/baseline.json is missing, so the token-regression gate is SKIPPED. To create it: download ci-result.json and its trace files from a CI eval run, run 'node scripts/eval-compare.mjs ci-result.json --write evals/baseline.json', and commit evals/baseline.json (see evals/README.md)."

      - name: Compare tokens with baseline
        if: success() && hashFiles('evals/baseline.json') != '' && steps.select.outputs.skip != 'true'
        env:
          PARTIAL: ${{ steps.select.outputs.partial }}
        run: |
          if [ "$PARTIAL" = "true" ]; then
            node scripts/eval-compare.mjs evals/ci-result.json evals/baseline.json --threshold 15
          else
            node scripts/eval-compare.mjs evals/ci-result.json evals/baseline.json --threshold 15 --strict
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: |
            evals/ci-result.json
            evals/ci-result-*.json
            evals/results/
          if-no-files-found: warn
